root = "."
tmp_dir = ".air"
env_files = []

[build]
cmd = "go build -o ./.air/service ./cmd/service"
entrypoint = ["./.air/service"]
include_ext = ["go", "yaml", "yml"]
include_file = ["go.mod", "go.sum"]
exclude_dir = [".air", "bin", ".git", "docs", "api", "deploy"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "25s"
log = "build-errors.log"

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
