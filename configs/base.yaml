service:
  name: microservice
http:
  address: "127.0.0.1:8080"
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  max_body_bytes: 1048576
  docs: false
database:
  driver: memory
  max_conns: 10
  min_conns: 0
  max_conn_lifetime: 1h
  max_conn_idle_time: 15m
  connect_timeout: 5s
  migration_timeout: 30s
logging:
  level: info
  format: json
telemetry:
  enabled: false
  sample_ratio: 0.1
  export_timeout: 5s
flags:
  provider: local
  init_timeout: 5s
  values:
    users-list: true
shutdown:
  drain_timeout: 10s
  cleanup_timeout: 5s
  telemetry_timeout: 5s
